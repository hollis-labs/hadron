openapi: 3.1.0
info:
  title: Widget API
  version: "2026-08-24"
servers:
  - url: https://api.example.test
security:
  - bearerAuth: []
paths:
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: revision
          in: query
          schema:
            type: integer
            maximum: 9007199254740993
        - name: include
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Found widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets:
    post:
      operationId: createWidget
      security:
        - apiKeyAuth: []
      x-hadron-effects:
        - compute
      x-hadron-capabilities:
        - widgets.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWidget"
      responses:
        "201":
          description: Created widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /profile:
    get:
      operationId: getProfile
      security:
        - basicAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Widget-Key
    basicAuth:
      type: http
      scheme: basic
      x-hadron-basic-username: service-account
  schemas:
    CreateWidget:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    Widget:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - revision
      properties:
        id:
          type: string
        name:
          type: string
        revision:
          type: integer
          maximum: 9007199254740993
