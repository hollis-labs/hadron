workflow:
  name: Malformed Activations
on:
  webhook:
    path: https://example.test/hook?token=bad
  schedule:
    cron: "0 6 * *"
    overlap: forbid
    starting_deadline: -1s
    run_id_reuse: TerminateExisting
  message:
    to: https://example.test/message
  file:
    path: ../outside
    events: [create, delete, create]
  event:
    type: bad event type
    source: "{{ inputs.source }}"
  one_shot:
    path: /callback?token=bad
    ttl: 0s
steps:
  - name: Done
    transform: {expression: inputs.value}
