name: build
# Builds the hadron binary on build-1 for pushes to main only and attaches it to
# the run, with sha256 sums. No tag or release is created. Fork PRs never reach
# this workflow; ci.yml (GitHub-hosted) covers pull requests, as in
# hollis-labs/substrate.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, build-1]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: use the go.mod toolchain, not the box's system Go
        run: echo "GOTOOLCHAIN=go$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test ./...
      - name: cross-build (CGO off; SQLite is pure Go)
        run: |
          set -eu
          v="$(git rev-parse --short=12 HEAD)"
          dist="$RUNNER_TEMP/dist"   # outside the checkout, so the binary does not report a dirty tree
          mkdir -p "$dist"
          for target in linux/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            stage="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$stage/hadron" ./cmd/hadron
            tar -C "$stage" -czf "$dist/hadron_${v}_${os}_${arch}.tar.gz" hadron
            rm -rf "$stage"
          done
          (cd "$dist" && sha256sum ./*.tar.gz > "hadron_${v}_SHA256SUMS")
          cat "$dist/hadron_${v}_SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: hadron-${{ github.sha }}
          path: ${{ runner.temp }}/dist/
          retention-days: 30
