name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and package
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/hadron-app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: cmd/hadron-app/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: cmd/hadron-app/frontend
        run: npx playwright install --with-deps chromium

      - name: Run verification suite
        run: |
          make build VERSION="${RELEASE_TAG}"
          make test
          make test-ui
          make typecheck
          make test-ui-e2e
          make e2e

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/hadron-app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: cmd/hadron-app/frontend
        run: npm ci

      - name: Build release artifacts
        run: make package-release VERSION="${RELEASE_TAG}"

      - name: Stage GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            dist/hadron_*.tar.gz
            dist/checksums.txt

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --verify-tag
