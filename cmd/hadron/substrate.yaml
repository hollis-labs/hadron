# Hadron on Substrate. The manifest is the whole shell: modules, config, nothing else.
app: hadron
variant: app-host
profiles: [agentic]
modules:
  add: [cli, database, scheduler, events, policy]
config:
  logging: { level: info, format: text }
  httphost: { addr: "127.0.0.1:8095" }
  database:
    sqlite: { path: hadron.db }
  # The runtime starts the scheduler engine with the recovered host; a short-lived command never does.
  scheduler: { autostart: false }
