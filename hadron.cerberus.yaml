kind: cerberus-project/v1
owner: hadron
namespace: local
project:
  id: hadron
  name: Hadron
resources:
  - id: hadron-daemon-service
    name: Hadron Daemon Service
    type: process
    project: hadron
    connector: local
    config:
      build_strategy:
        kind: make_standard
        rules:
          target: build
          output: bin/hadrond
      command:
        - ./bin/hadrond
        - serve
      dir: /Users/chrispian/dev/hollis-labs/apps/hadron
      env:
        # Cerberus's artifact install step always runs `make install` when a
        # Makefile is present. This Makefile's install target honors
        # PREFIX/BINDIR/DESTDIR per BSD/GNU convention, whose default
        # /usr/local needs root. Point it at Cerberus's own install_root
        # instead (same fix as tether-daemon-service).
        PREFIX: /Users/chrispian/.cerberus/apps/hadron/hadron-daemon-service
      mode: os_service
      port: 8095
      run_from: artifact
      supervisor: launchd
      url: http://127.0.0.1:8095
    tags:
      - api
      - go
      - launchd
      - v2
  - id: hadron-gui
    name: Hadron GUI
    type: process
    project: hadron
    connector: local
    config:
      command:
        - npm
        - run
        - dev
      dir: /Users/chrispian/dev/hollis-labs/apps/hadron/cmd/hadron-app/frontend
      env:
        HADRON_DAEMON_EXTERNAL: "true"
        CLAUDE_CODE_OAUTH_TOKEN: keychain://anthropic/claude-code-oauth
      mode: dev_session
      port: 34116
      run_from: workspace
    tags:
      - gui
      - frontend
      - vite
      - v2
registry_urn: msg://agent/agent-mux/prj_46qak5fkx1
